<main class="wrap"><section class="hero"><h1>APD545 퀴즈 · 시험 대비</h1>
<p>주차를 골라서 풀어요. <b>연습 모드</b>는 바로 채점하고 해설을 보여 주고, <b>시험 모드</b>는 어려운 문제부터 뽑아 시간 제한을 두고 제출한 뒤에 채점해요. 틀린 문제는 오답노트에 모여요.</p></section>

<script>window.QUIZ=[{"week": 7, "topic": "Multiple Views", "level": 1, "q": "In JavaFX, how is a transition between two views usually performed?", "opts": ["Calling `stage.setScene(otherScene)` inside an event handler", "Calling `scene.setStage(otherStage)` inside `main`", "Creating a new `Application` subclass for each view", "Calling `launch()` again with the new view"], "ex": "슬라이드: views are created as Scene-objects and the transitioning between them happens with events. 버튼 핸들러 안에서 `stage.setScene(...)`. Scene에는 setStage가 없고, `launch()`는 앱 시작 때 한 번만 불러요.", "refs": [{"label": "Week 7 노트 · Introduction", "href": "week-07.html#introduction"}]}, {"week": 7, "topic": "Multiple Views", "level": 2, "q": "What happens when the user clicks the button labelled \"Scene 1 ..\"?", "code": "Button sc1 = new Button(\"Scene 1 ..\");\nButton sc2 = new Button(\"Scene 2.\");\nScene first = new Scene(sc1);\nScene second = new Scene(sc2);\nsc1.setOnAction(e -> ps.setScene(second));\nsc2.setOnAction(e -> ps.setScene(first));\nps.setScene(first);\nps.show();", "opts": ["The window now shows the Scene that contains the \"Scene 2.\" button", "Nothing, because a Button cannot be the root of a Scene", "A second window opens with the \"Scene 2.\" button", "The program throws an exception because `ps` is not final"], "ex": "`sc1`(\"Scene 1 ..\")의 핸들러가 `ps.setScene(second)`예요. 같은 창(Stage)의 장면만 바뀌어요. Button도 Parent라 Scene 루트가 될 수 있고, `ps`는 effectively final이라 람다에서 쓸 수 있어요.", "refs": [{"label": "Week 7 노트 · Example: two Scenes, one Stage", "href": "week-07.html#example-two-scenes-one-stage"}]}, {"week": 7, "topic": "Multiple Views", "level": 2, "q": "The user types `password ` (with a trailing space) and clicks **Log in**. What is shown?", "code": "startButton.setOnAction(event -> {\n    if (!passwordField.getText().trim().equals(\"password\")) {\n        errorMessage.setText(\"Unknown password!\");\n        return;\n    }\n    window.setScene(welcomeView);\n});", "opts": ["The welcome view, because `trim()` removes the space before comparing", "\"Unknown password!\" because of the trailing space", "Nothing changes, because `==` is used", "A compile error, because `PasswordField` has no `getText()`"], "ex": "`passwordField.getText().trim()`이 앞뒤 공백을 지운 뒤 `.equals(\"password\")`로 비교하니 true예요. 그래서 return하지 않고 `setScene(welcomeView)`. PasswordField도 TextField의 하위 클래스라 `getText()`가 있어요.", "refs": [{"label": "Week 7 노트 · One layout for each view", "href": "week-07.html#one-layout-for-each-view"}]}, {"week": 7, "topic": "Multiple Views", "level": 3, "q": "A student removes the `return;` line from the handler below. What happens when a wrong password is entered?", "code": "startButton.setOnAction(event -> {\n    if (!passwordField.getText().trim().equals(\"password\")) {\n        errorMessage.setText(\"Unknown password!\");\n        return;   // removed\n    }\n    window.setScene(welcomeView);\n});", "opts": ["The error message is set, and the view still switches to the welcome scene", "The error message is not shown at all", "A compile error, because the lambda must return a value", "The application closes"], "ex": "`return`은 잘못된 비밀번호일 때 아래 `setScene` 줄까지 가지 않게 막는 역할이에요. 지우면 에러 라벨을 바꾼 다음 그대로 환영 화면으로 넘어가요. `EventHandler.handle`은 void라 return 값이 필요 없어요. Week 7 Login 샘플에서도 이 `return` 누락이 버그였어요.", "refs": [{"label": "Week 7 노트 · One layout for each view", "href": "week-07.html#one-layout-for-each-view"}, {"label": "Week 7 노트 · Example: LoginController (open a second window)", "href": "week-07.html#example-logincontroller-open-a-second-window"}]}, {"week": 7, "topic": "Multiple Views", "level": 1, "q": "For an application with a permanent menu whose content area changes, which approach does the lecture recommend?", "opts": ["Keep one layout (e.g., BorderPane) and swap only the content part", "Create a new Stage for every menu item", "Call `launch()` each time a menu item is selected", "Use only one Scene with every control visible at once"], "ex": "\"a permanent view whose parts are swapped when needed\". 틀(BorderPane)은 두고 `setCenter(...)`로 가운데만 바꿔요. 샘플의 RootLayout + PlayerOverview가 이 방식이에요.", "refs": [{"label": "Week 7 노트 · View with same layout", "href": "week-07.html#view-with-same-layout"}]}, {"week": 7, "topic": "Multiple Views", "level": 2, "q": "`circlePane` currently has radius 1. What is the radius after calling `shrink()` once?", "code": "public void shrink() {\n    circle.setRadius(circle.getRadius() > 2 ? circle.getRadius() - 2 : circle.getRadius());\n}", "opts": ["1", "-1", "0", "3"], "ex": "`circle.getRadius() > 2 ? r - 2 : r`. 1은 2보다 크지 않으니 그대로 1. 원이 0 이하로 줄어드는 걸 막는 삼항 연산자예요.", "refs": [{"label": "Week 7 노트 · View with same layout", "href": "week-07.html#view-with-same-layout"}]}, {"week": 7, "topic": "Mouse and Key events", "level": 2, "q": "Which condition enlarges the circle only when the **right** mouse button is clicked?", "opts": ["`e.getButton() == MouseButton.SECONDARY`", "`e.getButton() == MouseButton.PRIMARY`", "`e.getCode() == KeyCode.RIGHT`", "`e.getClickCount() == 2`"], "ex": "PRIMARY = 왼쪽, SECONDARY = 오른쪽 버튼. `getCode()`는 KeyEvent의 메서드, `getClickCount()`는 클릭 횟수(더블클릭)예요.", "refs": [{"label": "Week 7 노트 · ControlCircleWithMouseAndKey", "href": "week-07.html#controlcirclewithmouseandkey"}]}, {"week": 7, "topic": "Mouse and Key events", "level": 2, "q": "Why does the example register the key handler with `scene.setOnKeyPressed(...)` instead of `circlePane.setOnKeyPressed(...)`?", "opts": ["Key events go to the node that has focus, and a plain Pane usually does not receive focus", "Panes cannot have any event handlers", "`setOnKeyPressed` exists only on Scene", "Key events are delivered only after `primaryStage.show()`"], "ex": "키 입력은 **포커스를 가진 노드**로 가요. Pane은 보통 포커스를 안 받아서 Pane에 달면 반응이 없을 수 있어요. Scene에 달면 확실해요. Pane에도 `setOnMouseClicked`처럼 이벤트 핸들러는 달 수 있고, `setOnKeyPressed`도 Node에 있어요.", "refs": [{"label": "Week 7 노트 · ControlCircleWithMouseAndKey", "href": "week-07.html#controlcirclewithmouseandkey"}]}, {"week": 7, "topic": "Stage and dialog", "level": 2, "q": "Which line makes the dialog block interaction with its owner window until it is closed?", "opts": ["`dialog.initModality(Modality.WINDOW_MODAL);`", "`dialog.setTitle(\"Edit\");`", "`dialog.setScene(new Scene(content));`", "`dialog.show();`"], "ex": "`initModality(WINDOW_MODAL)` + `initOwner(primaryStage)`가 주인 창 클릭을 막아요. `show()`는 그냥 띄우고 바로 다음 줄로 가요. 기다리게 하려면 `showAndWait()`.", "refs": [{"label": "Week 7 노트 · Example: HelloApplication (Injector + controller factory)", "href": "week-07.html#example-helloapplication-injector-controller-factory"}]}, {"week": 7, "topic": "Stage and dialog", "level": 3, "q": "What is printed if the user clicks **Cancel** in the dialog (the handler sets `isClicked = false` and closes the stage)?", "code": "System.out.println(\"before\");\nboolean saved = mainApp.showPlayerAddEditDialog(); // uses dialog.showAndWait()\nSystem.out.println(saved);", "opts": ["`before`, then `false`", "`before`, `false` printed before the dialog appears", "`before`, then `true`", "Only `before`, because `showAndWait()` never returns"], "ex": "`showAndWait()`는 창이 닫힐 때까지 **기다렸다가** 다음 줄을 실행해요. Cancel은 `isClicked=false`로 두고 `stage.close()`. 그래서 `before` → (창 닫힘) → `false`. `show()`였다면 닫히기 전에 바로 `false`가 찍혔을 거예요.", "refs": [{"label": "Week 7 노트 · Example: PlayerEditDialogController (Save / Cancel)", "href": "week-07.html#example-playereditdialogcontroller-save-cancel"}]}, {"week": 7, "topic": "IoC", "level": 1, "q": "Which statement best defines Inversion of Control (IoC)?", "opts": ["Control over object creation or program flow is handed from application code to a framework or container", "Every class creates its own dependencies with `new`", "The program runs its methods in reverse order", "A database controls the user interface"], "ex": "정의: control over program flow or object creation is **inverted**: 프레임워크/컨테이너가 객체를 제공하고 흐름을 관리. 핵심 문장 \"Don't call us, we'll call you.\"", "refs": [{"label": "Week 7 노트 · Inversion of Control (IoC)", "href": "week-07.html#inversion-of-control-ioc"}]}, {"week": 7, "topic": "IoC", "level": 1, "q": "Which phrase is the key idea of IoC in the lecture?", "opts": ["\"Don't call us, we'll call you.\"", "\"Write once, run anywhere.\"", "\"Convention over configuration.\"", "\"Fail fast.\""], "ex": "할리우드 원칙. 내 코드가 프레임워크를 부르는 게 아니라 프레임워크가 내 코드를 불러요. WORA는 Java 플랫폼 독립성(Week 1)이에요.", "refs": [{"label": "Week 7 노트 · Inversion of Control (IoC)", "href": "week-07.html#inversion-of-control-ioc"}]}, {"week": 7, "topic": "IoC", "level": 2, "q": "Which is **NOT** one of the benefits of IoC listed in the lecture?", "opts": ["Faster execution speed", "Decoupling", "Testability", "Maintainability"], "ex": "장점 4개: Decoupling, Flexibility, Testability, Maintainability. 실행 속도는 언급이 없어요 (오히려 컨테이너 때문에 약간 느릴 수도).", "refs": [{"label": "Week 7 노트 · Why it matters?", "href": "week-07.html#why-it-matters"}]}, {"week": 7, "topic": "IoC", "level": 2, "q": "\"Swap implementations easily, e.g., a mock repository instead of the real one.\" Which IoC benefit is this?", "opts": ["Flexibility", "Maintainability", "Concurrency", "Encapsulation"], "ex": "슬라이드 그대로: Flexibility: Swap implementations easily (e.g., mock vs real repository). Maintainability는 설정이 한곳에 모이고 `new`가 흩어지지 않는 것.", "refs": [{"label": "Week 7 노트 · Why it matters?", "href": "week-07.html#why-it-matters"}]}, {"week": 7, "topic": "IoC", "level": 2, "q": "Which statement about IoC and Dependency Injection is correct?", "opts": ["DI is the most commonly used technique for achieving IoC, but IoC is the broader principle", "IoC and DI are exactly the same thing", "IoC is one technique of DI", "DI is only possible without a framework"], "ex": "\"IoC ≠ Dependency Injection. Rather DI is the most commonly used technique of IoC.\" DI ⊂ IoC. 이벤트 콜백도 IoC지만 DI는 아니에요.", "refs": [{"label": "Week 7 노트 · What IoC is not?", "href": "week-07.html#what-ioc-is-not"}]}, {"week": 7, "topic": "IoC techniques", "level": 2, "q": "A class asks a central object for its dependency: `repo = Locator.get(PlayerRepository.class);`. Which IoC technique is this, and why is it less favored today?", "opts": ["Service Locator; it hides the class's dependencies", "Constructor Injection; it makes dependencies too explicit", "Template Method; it fixes the order of steps", "Event callback; the framework calls the class"], "ex": "클래스가 중앙 locator에게 **요청**하는 방식 = Service Locator. 어떻게 만드는지는 클래스가 정하지 않으니 IoC지만, 생성자만 봐서는 무엇에 의존하는지 **안 보여서(hides)** 덜 써요.", "refs": [{"label": "Week 7 노트 · IoC Techniques", "href": "week-07.html#ioc-techniques"}]}, {"week": 7, "topic": "IoC techniques", "level": 3, "q": "JavaFX calls your `start(Stage)` method after `launch()`, and calls your button handler when the button is clicked. Which IoC technique does this illustrate?", "opts": ["Event-driven / callback style: inversion of program flow", "Dependency Injection: inversion of object creation", "Service Locator", "It is not IoC because no framework is involved"], "ex": "프레임워크(JavaFX)가 **적절한 때에 내 코드를 불러요**. 슬라이드: This inversion of control is about **program flow**, not just object creation. 객체 생성 역전(DI)과 구분하세요.", "refs": [{"label": "Week 7 노트 · IoC Techniques", "href": "week-07.html#ioc-techniques"}]}, {"week": 7, "topic": "IoC techniques", "level": 2, "q": "\"The framework defines the skeleton of an algorithm, and your subclass provides specific steps.\" Which technique is this?", "opts": ["Template Method Pattern", "Service Locator Pattern", "Repository Pattern", "Singleton Pattern"], "ex": "Template Method: 순서(뼈대)는 프레임워크가, 단계 내용은 하위 클래스가. `Application`의 `init()` → `start()` → `stop()` 순서를 JavaFX가 정하는 것과 비슷해요.", "refs": [{"label": "Week 7 노트 · IoC Techniques", "href": "week-07.html#ioc-techniques"}]}, {"week": 7, "topic": "Guice", "level": 2, "q": "Which Guice binding maps the interface to its implementation and shares one instance across the app?", "opts": ["`bind(IPlayerRepository.class).to(PlayerRepository.class).in(Singleton.class);`", "`bind(PlayerRepository.class).to(IPlayerRepository.class).in(Singleton.class);`", "`bind(IPlayerRepository.class).toInstance(Singleton.class);`", "`inject(IPlayerRepository.class, new PlayerRepository());`"], "ex": "방향은 **인터페이스 → 구현**. `in(Singleton.class)`(또는 `Scopes.SINGLETON`)로 앱 전체에서 하나. (b)는 방향이 거꾸로라 에러예요.", "refs": [{"label": "Week 7 노트 · Example: AppModule (Guice bindings)", "href": "week-07.html#example-appmodule-guice-bindings"}]}, {"week": 7, "topic": "Guice", "level": 2, "q": "Why does `AppModule` use a `@Provides` method for `Stage` instead of `bind(Stage.class).to(...)`?", "opts": ["The primary Stage is created by JavaFX and passed to `start()`, so Guice cannot construct it; the module simply returns that existing object", "`bind` cannot be used with JavaFX classes at all", "`@Provides` makes the Stage visible on screen", "Stage is an interface, so it needs `@Provides`"], "ex": "primaryStage는 JavaFX가 만들어서 `start(Stage)`로 넘겨주는 객체예요. Guice가 `new`로 만들 수 없으니 생성자로 받아 둔 것을 `@Provides` 메서드에서 돌려줘요. Stage는 클래스예요.", "refs": [{"label": "Week 7 노트 · Example: AppModule (Guice bindings)", "href": "week-07.html#example-appmodule-guice-bindings"}]}, {"week": 7, "topic": "Guice + FXML", "level": 3, "q": "A controller has only the constructor `@Inject public MainController(IUserService s)`. The FXML declares `fx:controller` for it, but the loader does **not** call `setControllerFactory`. What happens on `loader.load()`?", "opts": ["It fails, because FXMLLoader tries to create the controller with a no-arg constructor", "Guice injects `IUserService` automatically", "The controller is created with `s = null`", "FXMLLoader skips the controller and loads only the UI"], "ex": "FXMLLoader는 기본적으로 **인자 없는 생성자**로 컨트롤러를 만들어요. 그런 생성자가 없으니 예외. `loader.setControllerFactory(injector::getInstance)`로 Guice에게 컨트롤러 생성을 맡겨야 `@Inject` 생성자가 쓰여요.", "refs": [{"label": "Week 7 노트 · Example from the class", "href": "week-07.html#example-from-the-class"}, {"label": "Week 7 노트 · Example: HelloApplication (Injector + controller factory)", "href": "week-07.html#example-helloapplication-injector-controller-factory"}]}, {"week": 7, "topic": "Guice + FXML", "level": 2, "q": "What does `loader.setControllerFactory(injector::getInstance)` mean?", "opts": ["Whenever the loader needs a controller class, ask the Guice injector to create it (with its dependencies)", "Create a new injector for every FXML file", "Register the controller as a singleton in AppModule", "Load the FXML file through Guice instead of FXMLLoader"], "ex": "`injector::getInstance`는 `cls -> injector.getInstance(cls)`의 메서드 참조. 컨트롤러 생성만 Guice에 맡기고, FXML 로드는 여전히 FXMLLoader가 해요.", "refs": [{"label": "Week 7 노트 · Example: HelloApplication (Injector + controller factory)", "href": "week-07.html#example-helloapplication-injector-controller-factory"}]}, {"week": 7, "topic": "Guice + FXML", "level": 3, "q": "Where must the code that fills `playerTable` be placed, and why?", "opts": ["In the `@FXML initialize()` method, because `@FXML` fields are still null inside the constructor", "In the constructor, because it runs after FXML loading", "In `main`, because controllers cannot access tables", "In `AppModule.configure()`"], "ex": "순서: 생성자(Guice가 호출) → FXML 로드가 `@FXML` 필드 주입 → `initialize()` 자동 호출. 생성자 안에서 `playerTable`은 아직 null이라 NullPointerException.", "refs": [{"label": "Week 7 노트 · Example: PlayerOverviewController (@Inject constructor)", "href": "week-07.html#example-playeroverviewcontroller-inject-constructor"}]}, {"week": 7, "topic": "Guice", "level": 3, "q": "`AppModule` binds `IPlayerRepository` to `PlayerRepository` as a singleton. Two controllers ask for the **concrete** type `PlayerRepository` in their `@Inject` constructors. What do they receive?", "code": "bind(IPlayerRepository.class).to(PlayerRepository.class).in(Singleton.class);\n\n@Inject PlayerOverviewController(Stage s, PlayerRepository repo) { ... }\n@Inject PlayerEditDialogController(PlayerRepository repo) { ... }", "opts": ["Two different PlayerRepository objects, because the singleton scope applies only to the `IPlayerRepository` key", "The same singleton object, because PlayerRepository is bound as a singleton", "`null`, because PlayerRepository is not bound", "A compile error"], "ex": "scope는 bind한 **키(IPlayerRepository)**에 붙어요. 구체 클래스 `PlayerRepository`를 직접 요청하면 Guice가 just-in-time으로 **매번 새로** 만들어요. 그래서 생성자 타입은 인터페이스(`IPlayerRepository`)로 써야 같은 저장소를 공유해요. (실제로 Guice 7로 실행해서 확인한 결과예요.)", "refs": [{"label": "Week 7 노트 · Example: PlayerOverviewController (@Inject constructor)", "href": "week-07.html#example-playeroverviewcontroller-inject-constructor"}]}, {"week": 7, "topic": "Repository", "level": 2, "q": "Why does `PlayerRepository` store players in an `ObservableList`?", "opts": ["A TableView bound with `setItems(list)` updates automatically when the list changes", "ObservableList is required by Guice", "ObservableList saves data to a database", "ArrayList cannot store objects"], "ex": "ObservableList는 변경을 알려줘서, `playerTable.setItems(repo.findAll())` 해 두면 add/remove만 해도 TableView가 자동 갱신돼요.", "refs": [{"label": "Week 7 노트 · Example: Repository interface and implementation", "href": "week-07.html#example-repository-interface-and-implementation"}]}, {"week": 7, "topic": "Module system", "level": 2, "q": "Which `module-info.java` line lets FXMLLoader inject values into `@FXML private` fields of classes in the controllers package?", "opts": ["`opens ca.senecacollege.application.controllers to javafx.fxml;`", "`requires ca.senecacollege.application.controllers;`", "`exports javafx.fxml to ca.senecacollege.application.controllers;`", "`uses javafx.fxml;`"], "ex": "FXMLLoader는 리플렉션으로 private 필드에 접근해요. 그러려면 그 패키지를 `opens ... to javafx.fxml`로 열어야 해요. `exports`는 public 타입 공개용.", "refs": [{"label": "Week 7 노트 · Example: module-info.java", "href": "week-07.html#example-module-infojava"}]}, {"week": 7, "topic": "Sample code bugs", "level": 3, "q": "In `WK_7_Login_MySql`, `insertRecord(String fn, String email, String pw)` is called as `db.insertRecord(emailTextField.getText(), fullnameTextField.getText(), passwordField.getText())`. What is stored?", "opts": ["The email goes into `full_name` and the name goes into `email_id`", "Everything is stored correctly because JDBC matches by name", "A compile error, because the argument order is wrong", "Nothing, because PreparedStatement rejects swapped values"], "ex": "세 인자가 모두 String이라 컴파일러는 순서 실수를 못 잡아요. `setString(1, fn)`이 full_name 자리인데 이메일이 들어가요. 인자 순서와 `?` 순서를 항상 맞춰야 해요.", "refs": [{"label": "Week 7 노트 · Example: RegistrationController", "href": "week-07.html#example-registrationcontroller"}]}, {"week": 8, "topic": "ORM", "level": 1, "q": "Why is data called **persistent** in enterprise applications?", "opts": ["It must remain available between multiple runs of the program", "It is stored only in RAM", "It cannot be changed by users", "It is always encrypted"], "ex": "슬라이드: The data is persistent because it needs to be around **between multiple runs of the program**. 앱을 껐다 켜도 남아 있어야 해서 DB에 저장해요.", "refs": [{"label": "Week 8 노트 · Why the need?", "href": "week-08.html#why-the-need"}]}, {"week": 8, "topic": "3-Tier", "level": 2, "q": "In the three principal layers, where does validation of data coming from the presentation belong?", "opts": ["Domain logic (business logic)", "Presentation", "Data source", "None; validation is done by the database only"], "ex": "Domain logic: calculations, **validation of any data that comes in from the presentation**, deciding which data source logic to dispatch. 우리 앱의 Service 층이에요.", "refs": [{"label": "Week 8 노트 · The Three Principal Layers (3-Tier Architecture)", "href": "week-08.html#the-three-principal-layers-3-tier-architecture"}]}, {"week": 8, "topic": "3-Tier", "level": 1, "q": "Which layer handles communication with databases, messaging systems and other applications?", "opts": ["Data source", "Presentation", "Domain logic", "Controller"], "ex": "Data source logic: communicating with other systems (transaction monitors, other applications, messaging systems). JDBC DAO/Repository가 여기에 속해요.", "refs": [{"label": "Week 8 노트 · The Three Principal Layers (3-Tier Architecture)", "href": "week-08.html#the-three-principal-layers-3-tier-architecture"}]}, {"week": 8, "topic": "ORM", "level": 2, "q": "What is the main \"trouble with objects\" that ORM tries to solve?", "opts": ["Relational databases store tables of rows and columns, which do not map easily to classes, inheritance and references", "Objects use too much memory", "Databases cannot store strings", "Java cannot connect to databases without ORM"], "ex": "Object-relational mismatch: DB의 핵심 추상화는 객체가 아니라 **테이블(행, 열)** 또는 key-value. 상속, 다형성, 연관 같은 OO 개념이 쉽게 옮겨지지 않아요.", "refs": [{"label": "Week 8 노트 · Trouble with Objects", "href": "week-08.html#trouble-with-objects"}]}, {"week": 8, "topic": "ORM", "level": 2, "q": "Following the naming convention of many ORM systems, which table stores `Person` objects?", "opts": ["`people`", "`Person`", "`person_table`", "`tbl_person`"], "ex": "클래스 이름은 **단수**, 테이블 이름은 그 **복수형**. Person ⇒ People, Cat ⇒ Cats, Dog ⇒ dogs.", "refs": [{"label": "Week 8 노트 · Example: Dog and Owner", "href": "week-08.html#example-dog-and-owner"}]}, {"week": 8, "topic": "Join table", "level": 2, "q": "Using the join table below (`dog_fk | owner_fk`), who owns Fido (dog 1)?", "code": "dogs:   1 Fido | 2 Spot\nowners: 1 Ken  | 2 Max\njoin (dog_fk | owner_fk):\n  1 | 1\n  1 | 2\n  2 | 2", "opts": ["Ken and Max", "Only Ken", "Only Max", "Nobody"], "ex": "`dog_fk = 1`인 행: `1|1`(Ken), `1|2`(Max). 그래서 Fido의 주인은 Ken과 Max. Spot(2)은 `2|2`라 Max만.", "refs": [{"label": "Week 8 노트 · Join table", "href": "week-08.html#join-table"}]}, {"week": 8, "topic": "ORM", "level": 3, "q": "Which relationship type requires a separate linking (join) table in a relational database?", "opts": ["Many-to-many", "One-to-one", "One-to-many", "Inheritance with a single table"], "ex": "다대다는 양쪽 테이블에 외래키 하나로 표현할 수 없어서 join table이 필요해요. 일대다는 \"다\" 쪽에 외래키 열 하나면 돼요 (`players.team_id`).", "refs": [{"label": "Week 8 노트 · Relational Models vs OO Models", "href": "week-08.html#relational-models-vs-oo-models"}, {"label": "Week 8 노트 · Relationships", "href": "week-08.html#relationships"}]}, {"week": 8, "topic": "ORM", "level": 1, "q": "Which is the best definition of ORM?", "opts": ["A technique for converting data between incompatible type systems (objects and relational tables), often using metadata to map them", "A Java GUI library for tables", "A type of JDBC driver", "A database that stores only objects"], "ex": "ORM: converting data between incompatible type systems, wrapping tables in classes, metadata로 매핑 → \"virtual object database\" 효과. 객체 DB 자체가 아니라 그런 **효과**를 내는 것.", "refs": [{"label": "Week 8 노트 · What is ORM then?", "href": "week-08.html#what-is-orm-then"}]}, {"week": 8, "topic": "ORM", "level": 2, "q": "In relational vs OO models, which pair is correctly matched for **identity**?", "opts": ["Primary key in the database vs object reference/equality in Java", "Foreign key in the database vs inheritance in Java", "`char(n)` vs `String`", "Join table vs `List<T>`"], "ex": "Identity: keys versus address or equality. Relations는 foreign keys vs references, Types는 char(n) vs string, 다대다는 linking table.", "refs": [{"label": "Week 8 노트 · Relational Models vs OO Models", "href": "week-08.html#relational-models-vs-oo-models"}]}, {"week": 8, "topic": "ORM", "level": 2, "q": "According to the lecture, what is the single most important aspect when selecting an ORM tool?", "opts": ["Object-to-database mapping", "GUI mapping", "Object caching", "Lazy loading"], "ex": "\"Object-to-database mapping: The single most important aspect of an ORM tool.\" GUI mapping은 \"있으면 보너스\".", "refs": [{"label": "Week 8 노트 · Selecting a suitable ORM", "href": "week-08.html#selecting-a-suitable-orm"}]}, {"week": 8, "topic": "ORM", "level": 2, "q": "\"Nonintrusive persistence\" in an ORM means:", "opts": ["Your domain classes do not need to extend ORM-specific classes or implement ORM-specific interfaces", "The ORM never writes to the database", "Data is stored without a primary key", "The ORM runs without a JDBC driver"], "ex": "nonintrusive = 내 클래스를 침범하지 않음: no more class, interface or inheritance based specific relations. 평범한 Java 클래스(POJO)를 그대로 저장.", "refs": [{"label": "Week 8 노트 · Selecting a suitable ORM", "href": "week-08.html#selecting-a-suitable-orm"}]}, {"week": 8, "topic": "DDD", "level": 2, "q": "A car's color, engine type and model cannot exist on their own and have no identity. In DDD they are:", "opts": ["Value objects", "Entities", "Aggregates", "Repositories"], "ex": "Value object: 정체성 없음, 혼자 존재 못 함, Entity를 설명, 보통 immutable. 차 자체(VIN으로 구분)는 Entity.", "refs": [{"label": "Week 8 노트 · Value Objects", "href": "week-08.html#value-objects"}]}, {"week": 8, "topic": "DDD", "level": 2, "q": "Which object is best modelled as an **entity**?", "opts": ["A `Student` with a unique student number", "A `Money` value of 10 CAD", "A `Color` of red", "A postal `Address` used only to describe a customer"], "ex": "Entity는 고유한 identity가 있어서 값이 같아도 구분해야 하는 것. 학생 번호가 있는 Student. 금액, 색, 주소는 값만으로 의미 있는 value object.", "refs": [{"label": "Week 8 노트 · Entities", "href": "week-08.html#entities"}]}, {"week": 8, "topic": "ORM patterns", "level": 3, "q": "In which pattern does a domain object contain its own database access methods such as `player.save()` and `player.delete()`?", "opts": ["Active Record", "Data Mapper", "Domain Model", "Lazy Loading"], "ex": "Active Record: encapsulates database access functionality, 객체 스스로 저장. Data Mapper는 metadata로 매핑하고 **별도 객체**가 저장(`mapper.save(player)`), 도메인 객체는 DB를 몰라요.", "refs": [{"label": "Week 8 노트 · Object-Relational Patterns", "href": "week-08.html#object-relational-patterns"}]}, {"week": 8, "topic": "ORM patterns", "level": 2, "q": "Which pattern creates one class per database table?", "opts": ["Table Module", "Domain Model", "Data Mapper", "Aggregate"], "ex": "Table Module: the purpose of the table module is to create **a class per table**. Domain Model은 의미 있는 객체들의 그물.", "refs": [{"label": "Week 8 노트 · Object-Relational Patterns", "href": "week-08.html#object-relational-patterns"}]}, {"week": 8, "topic": "Inheritance mapping", "level": 2, "q": "Which inheritance-mapping approach does the lecture call the most common?", "opts": ["Table per concrete class", "Single table per class hierarchy", "Table per class (every class has its own table)", "No table for subclasses"], "ex": "\"The most common approach used to handle inheritance in ORM\": 추상이 아닌 클래스마다 테이블 하나. Single table은 빠르고 쉽지만 타입이 많으면 복잡해요.", "refs": [{"label": "Week 8 노트 · Inheritance Mapping", "href": "week-08.html#inheritance-mapping"}]}, {"week": 8, "topic": "Lazy loading", "level": 1, "q": "Taking out only the ingredients you need for the dish you are cooking right now (in a small kitchen) is an analogy for:", "opts": ["Lazy loading", "Eager loading", "Object caching", "Join tables"], "ex": "Lazy loading: 필요할 때만 불러와 메모리를 아낌. 모든 재료를 한꺼번에 꺼내는 건 eager loading.", "refs": [{"label": "Week 8 노트 · Lazy Loading", "href": "week-08.html#lazy-loading"}]}, {"week": 8, "topic": "UML", "level": 1, "q": "Which UML diagram shows the static structure of classes, their attributes and relationships such as inheritance and composition?", "opts": ["Class diagram", "Sequence diagram", "Object diagram", "Activity diagram"], "ex": "Class diagram: static model with all the attributes and relationships. Sequence는 시간 순서 메시지, Object는 class diagram의 단순화(인스턴스).", "refs": [{"label": "Week 8 노트 · UML", "href": "week-08.html#uml"}]}, {"week": 8, "topic": "JDBC", "level": 1, "q": "What does JDBC stand for and provide?", "opts": ["Java Database Connectivity: a standard, database-independent API for connecting Java applications to relational databases", "Java Data Binding Component: binds JavaFX controls to tables", "Java Dynamic Byte Code: speeds up SQL", "Java Desktop Builder Class: builds GUIs for databases"], "ex": "JDBC API provides industry-standard and **database-independent** connectivity between Java applications and relational databases.", "refs": [{"label": "Week 8 노트 · What is JDBC?", "href": "week-08.html#what-is-jdbc"}]}, {"week": 8, "topic": "JDBC", "level": 2, "q": "Which two packages make up the JDBC API?", "opts": ["`java.sql` and `javax.sql`", "`java.io` and `java.net`", "`javafx.sql` and `java.db`", "`java.jdbc` and `javax.jdbc`"], "ex": "JDBC API consists of two packages: `java.sql`(Connection, Statement, ResultSet...)과 `javax.sql`(DataSource, 커넥션 풀 등).", "refs": [{"label": "Week 8 노트 · JDBC API", "href": "week-08.html#jdbc-api"}]}, {"week": 8, "topic": "JDBC", "level": 2, "q": "Who provides the classes that actually implement `Connection`, `Statement` and `ResultSet` for MySQL?", "opts": ["The MySQL JDBC driver (e.g., MySQL Connector/J)", "The JDK itself, for every database", "JavaFX", "Guice"], "ex": "인터페이스는 표준 Java에 있고, **구현은 DB별 JDBC 드라이버**가 제공해요. 그래서 pom.xml에 `mysql-connector-j`(또는 `sqlite-jdbc`)를 추가해야 해요.", "refs": [{"label": "Week 8 노트 · JDBC API", "href": "week-08.html#jdbc-api"}]}, {"week": 8, "topic": "JDBC", "level": 2, "q": "Which object is used to execute a **stored procedure**?", "opts": ["CallableStatement", "PreparedStatement", "Statement", "DatabaseMetaData"], "ex": "CallableStatement objects are used to execute stored procedures. Statement/PreparedStatement는 일반 SQL.", "refs": [{"label": "Week 8 노트 · Core JDBC Interfaces", "href": "week-08.html#core-jdbc-interfaces"}]}, {"week": 8, "topic": "JDBC drivers", "level": 2, "q": "Which JDBC driver type is written entirely in Java and talks directly to the database with no native code?", "opts": ["Type 4", "Type 1", "Type 2", "Type 3"], "ex": "Type 4: All Java driver, communicates directly with the database, no local native code (Oracle Thin). Type 2는 native 포함, Type 3은 중간 서버 경유, Type 1은 ODBC bridge.", "refs": [{"label": "Week 8 노트 · JDBC Driver Types", "href": "week-08.html#jdbc-driver-types"}]}, {"week": 8, "topic": "JDBC drivers", "level": 2, "q": "Which driver type communicates with a middle-tier server that in turn talks to the database?", "opts": ["Type 3", "Type 4", "Type 2", "Type 1"], "ex": "Type 3: All Java + Middleware translation driver. 네트워크 프로토콜로 중간 서버와 통신.", "refs": [{"label": "Week 8 노트 · JDBC Driver Types", "href": "week-08.html#jdbc-driver-types"}]}, {"week": 8, "topic": "JDBC", "level": 1, "q": "Put the JDBC steps in the correct order.", "opts": ["Connect → create statement → execute query → process result set", "Create statement → connect → process result set → execute query", "Execute query → connect → create statement → close", "Process result set → execute query → connect → create statement"], "ex": "Connect to the database → Create a statement → Execute the query → Look at the result set → (Close, try-with-resources면 불필요).", "refs": [{"label": "Week 8 노트 · JDBC Technology: four steps", "href": "week-08.html#jdbc-technology-four-steps"}]}, {"week": 8, "topic": "JDBC methods", "level": 2, "q": "Which method should be used to run `SELECT * FROM users`, and what does it return?", "opts": ["`executeQuery`, returning a `ResultSet`", "`executeUpdate`, returning an `int`", "`execute`, returning a `ResultSet`", "`executeQuery`, returning a `boolean`"], "ex": "SELECT → `executeQuery` → `ResultSet`. `executeUpdate`는 INSERT/UPDATE/DELETE에 쓰고 영향받은 행 수(int). `execute`는 boolean.", "refs": [{"label": "Week 8 노트 · execute, executeQuery, executeUpdate", "href": "week-08.html#execute-executequery-executeupdate"}]}, {"week": 8, "topic": "JDBC methods", "level": 3, "q": "What is printed? (Assume the table did not exist before.)", "code": "boolean success = statement.execute(\n    \"CREATE TABLE IF NOT EXISTS Users (id INTEGER PRIMARY KEY, username TEXT)\");\nif (success)\n    System.out.println(\"Table is not created as the resultSet is being returned\");\nelse\n    System.out.println(\"Table is created\");", "opts": ["`Table is created`", "`Table is not created as the resultSet is being returned`", "Nothing; `execute` throws for CREATE TABLE", "`true`"], "ex": "`execute()`는 결과가 **ResultSet이면 true**, 아니면 false. CREATE TABLE은 ResultSet이 없으니 false → else 분기 \"Table is created\". true/false를 성공/실패로 읽으면 안 돼요.", "refs": [{"label": "Week 8 노트 · Create Statement Object and execute", "href": "week-08.html#create-statement-object-and-execute"}]}, {"week": 8, "topic": "JDBC methods", "level": 2, "q": "`int n = ps.executeUpdate();` runs `UPDATE players SET goals = goals + 1 WHERE team = 'Alpha'` and two players are in team Alpha. What is `n`?", "opts": ["2", "1", "0", "true"], "ex": "`executeUpdate`는 **영향받은 행 수**를 돌려줘요. Alpha 팀 두 명이 바뀌었으니 2. (실제 SQLite로 실행해 확인한 노트의 연습 코드와 같아요.)", "refs": [{"label": "Week 8 노트 · Execute statement with Insert", "href": "week-08.html#execute-statement-with-insert"}]}, {"week": 8, "topic": "ResultSet", "level": 2, "q": "Which loop correctly prints every row of a `ResultSet rs`?", "opts": ["`while (rs.next()) { System.out.println(rs.getString(1)); }`", "`for (int i = 0; i < rs.size(); i++) { ... rs.get(i) ... }`", "`do { System.out.println(rs.getString(1)); } while (rs.next());`", "`while (rs.hasNext()) { System.out.println(rs.next()); }`"], "ex": "커서는 **첫 행 앞**에서 시작해요. `next()`로 한 칸 내려가면서 행이 있으면 true. (c)는 next() 전에 읽어서 예외. ResultSet에는 `size()`, `hasNext()`가 없어요.", "refs": [{"label": "Week 8 노트 · Execute statement with ResultSet", "href": "week-08.html#execute-statement-with-resultset"}]}, {"week": 8, "topic": "ResultSet", "level": 2, "q": "In `rs.getString(2)`, what does `2` refer to?", "opts": ["The second column of the current row (indexes start at 1)", "The third column (indexes start at 0)", "The second row", "The column named \"2\""], "ex": "JDBC의 열 번호와 `?` 번호는 **1부터** 시작해요. 열 이름으로도 읽을 수 있어요: `rs.getString(\"username\")`.", "refs": [{"label": "Week 8 노트 · Execute statement with ResultSet", "href": "week-08.html#execute-statement-with-resultset"}]}, {"week": 8, "topic": "PreparedStatement", "level": 2, "q": "Which is the correct way to set the second placeholder to the double `9.3`?", "code": "PreparedStatement ps = connection.prepareStatement(\n    \"INSERT INTO books (bname, bprice) VALUES (?, ?)\");", "opts": ["`ps.setDouble(2, 9.3);`", "`ps.setDouble(1, 9.3);`", "`ps.set(2, 9.3);`", "`ps.setDouble(9.3, 2);`"], "ex": "`setXXX(placeholder번호, 값)`. 번호는 1부터, 타입별 메서드(setString, setInt, setDouble...).", "refs": [{"label": "Week 8 노트 · Prepared Statement", "href": "week-08.html#prepared-statement"}]}, {"week": 8, "topic": "PreparedStatement", "level": 3, "q": "What is wrong with this code?", "code": "String sql = \"SELECT * FROM books WHERE bname = ?\";\nPreparedStatement ps = connection.prepareStatement(sql);\nps.setString(1, \"Harry Potter\");\nResultSet rs = ps.executeQuery(sql);", "opts": ["`executeQuery(sql)` should be called with no argument on a PreparedStatement; the SQL was already given to `prepareStatement`", "`setString` indexes start at 0, so it should be `setString(0, ...)`", "PreparedStatement cannot run SELECT statements", "Nothing is wrong"], "ex": "PreparedStatement는 SQL을 `prepareStatement(sql)`에서 이미 받았어요. 실행은 `ps.executeQuery()` **인자 없이**. SQL을 다시 넘기면 SQLException이 나요.", "refs": [{"label": "Week 8 노트 · Prepared Statement", "href": "week-08.html#prepared-statement"}]}, {"week": 8, "topic": "PreparedStatement", "level": 2, "q": "Which is **NOT** a benefit of PreparedStatement mentioned in the lecture?", "opts": ["It removes the need for a JDBC driver", "It helps prevent SQL injection attacks", "It is precompiled and can be faster for repeated queries", "It allows parametric (dynamic) queries with placeholders"], "ex": "장점: 매개변수 쿼리, 미리 컴파일되어 빠름, **SQL Injection 방지**, 읽기 쉽고 안전. 드라이버는 여전히 필요해요.", "refs": [{"label": "Week 8 노트 · Benefits of using PreparedStatement", "href": "week-08.html#benefits-of-using-preparedstatement"}]}, {"week": 8, "topic": "PreparedStatement", "level": 3, "q": "A user types `' OR '1'='1` into the password field. Which code is protected from SQL injection?", "opts": ["`ps = conn.prepareStatement(\"... WHERE email = ? AND password = ?\"); ps.setString(2, pw);`", "`stmt.executeQuery(\"... WHERE password = '\" + pw + \"'\");`", "`stmt.executeQuery(\"... WHERE password = \" + pw.trim());`", "`stmt.execute(String.format(\"... WHERE password = '%s'\", pw));`"], "ex": "자리표시자 `?`에 들어간 값은 드라이버가 **escape**해서 SQL 문법으로 해석되지 않아요. 나머지는 모두 문자열 이어 붙이기라 `... password = '' OR '1'='1'`이 되어 항상 참.", "refs": [{"label": "Week 8 노트 · Benefits of using PreparedStatement", "href": "week-08.html#benefits-of-using-preparedstatement"}]}, {"week": 8, "topic": "try-with-resources", "level": 2, "q": "In the code below, when are `connection` and `ps` closed?", "code": "try (Connection connection = DriverManager.getConnection(URL, USER, PW);\n     PreparedStatement ps = connection.prepareStatement(SELECT_QUERY)) {\n    ps.setString(1, emailId);\n    ps.setString(2, password);\n    if (ps.executeQuery().next()) return true;\n} catch (SQLException e) {\n    printSQLException(e);\n}\nreturn false;", "opts": ["Automatically when the try block finishes, even if `return` or an exception happens", "Never; you must call `close()` in `finally`", "Only if no exception is thrown", "When the garbage collector runs"], "ex": "try-with-resources: 괄호 안 자원은 블록이 끝나면 **자동으로, 역순으로** close. return이나 예외가 있어도 마찬가지. 슬라이드: Close connection // not needed if you are using try-with-resources.", "refs": [{"label": "Week 8 노트 · Step 8: JdbcDao for database operations", "href": "week-08.html#step-8-jdbcdao-for-database-operations"}]}, {"week": 8, "topic": "JDBC 4.0", "level": 2, "q": "True or false: since JDBC 4.0 you must call `Class.forName(\"com.mysql.cj.jdbc.Driver\")` before `getConnection`.", "opts": ["False; DriverManager automatically loads a suitable driver found on the classpath", "True; otherwise getConnection always fails", "True, but only for SQLite", "False, because JDBC no longer uses drivers"], "ex": "슬라이드: From JDBC 4.0, we don't need to include `Class.forName()`. getConnection할 때 DriverManager가 맞는 드라이버를 자동으로 로드해요. 드라이버 jar는 여전히 클래스패스에 있어야 해요.", "refs": [{"label": "Week 8 노트 · Step 8: JdbcDao for database operations", "href": "week-08.html#step-8-jdbcdao-for-database-operations"}]}, {"week": 8, "topic": "JavaFX + JDBC", "level": 3, "q": "`validate(email, pw)` runs `SELECT * FROM registration WHERE email_id = ? and password = ?`. When does it return `true`?", "opts": ["When `resultSet.next()` finds at least one matching row", "When `executeQuery` returns a non-null ResultSet, even with zero rows", "When `executeUpdate` returns 1", "Always, unless an SQLException occurs"], "ex": "`executeQuery`는 행이 없어도 빈 ResultSet(null 아님)을 돌려줘요. 그래서 `if (resultSet.next())`로 **행이 있는지** 확인해야 해요.", "refs": [{"label": "Week 8 노트 · JdbcDao.validate", "href": "week-08.html#jdbcdaovalidate"}]}, {"week": 8, "topic": "JavaFX + JDBC", "level": 3, "q": "In the registration controller, why is `return;` placed after each `showAlert(...)` for empty fields?", "opts": ["So the method stops and does not insert a record with missing data", "Because `showAlert` requires a return value", "To close the window", "To roll back the database transaction"], "ex": "빈 값이면 경고만 띄우고 메서드를 끝내서 `insertRecord`까지 가지 않게 해요. Week 7 Login 샘플은 이 return이 빠져서 빈 이름이 저장되는 버그가 있었어요.", "refs": [{"label": "Week 8 노트 · Step 7: Registration Controller", "href": "week-08.html#step-7-registration-controller"}, {"label": "Week 7 노트 · Example: RegistrationController", "href": "week-07.html#example-registrationcontroller"}]}, {"week": 8, "topic": "Module system", "level": 2, "q": "A modular JavaFX project fails to compile at `import java.sql.Connection;`. Which line is missing from `module-info.java`?", "opts": ["`requires java.sql;`", "`opens java.sql to javafx.fxml;`", "`exports java.sql;`", "`requires mysql.connector;`"], "ex": "JDBC 타입은 `java.sql` 모듈에 있어요. 모듈 프로젝트면 `requires java.sql;`이 있어야 import가 돼요. Week 7 Login 샘플 module-info에 이 줄이 있어요.", "refs": [{"label": "Week 7 노트 · Example: module-info.java (requires java.sql)", "href": "week-07.html#example-module-infojava-requires-javasql"}]}, {"week": 8, "topic": "JavaFX + JDBC", "level": 3, "q": "The project compiles, but `getConnection(\"jdbc:mysql://localhost:3306/app\", ...)` throws `SQLException: No suitable driver found`. What is the most likely cause?", "opts": ["The MySQL JDBC driver (mysql-connector-j) is not on the classpath / not in pom.xml", "`requires java.sql;` is missing", "The SQL query has a syntax error", "`Class.forName` must be called in JDBC 4.0+"], "ex": "컴파일은 됐으니 `java.sql`은 있어요. 실행 시 URL에 맞는 드라이버를 못 찾은 것 → 드라이버 jar 누락. Week 7 Login 샘플 pom.xml에도 MySQL 드라이버가 빠져 있어요.", "refs": [{"label": "Week 8 노트 · Steps 1 to 3: Project, Libraries, Database", "href": "week-08.html#steps-1-to-3-project-libraries-database"}, {"label": "Week 7 노트 · Example: DatabaseAccess (JDBC)", "href": "week-07.html#example-databaseaccess-jdbc"}]}, {"week": 8, "topic": "JDBC", "level": 3, "q": "What is printed? (`books` is empty before this code; `id` is AUTOINCREMENT starting at 1.)", "code": "ps = conn.prepareStatement(\"INSERT INTO books (bname) VALUES (?)\");\nps.setString(1, \"Harry Potter\"); ps.executeUpdate();\nps.setString(1, \"Dog Man\");      ps.executeUpdate();\n\nps = conn.prepareStatement(\"SELECT id, bname FROM books WHERE bname = ?\");\nps.setString(1, \"Dog Man\");\nResultSet rs = ps.executeQuery();\nwhile (rs.next()) System.out.println(rs.getInt(1) + \" \" + rs.getString(2));", "opts": ["`2 Dog Man`", "`1 Dog Man`", "`1 Harry Potter`", "`2 Harry Potter`"], "ex": "같은 PreparedStatement를 재사용해 INSERT 두 번 → (1, Harry Potter), (2, Dog Man). SELECT는 `bname = 'Dog Man'`인 행만 → `2 Dog Man`. 재사용해도 이전 값이 덮어써지지 않고 행이 하나씩 추가돼요.", "refs": [{"label": "Week 8 노트 · Insert and Select using PreparedStatement", "href": "week-08.html#insert-and-select-using-preparedstatement"}]}, {"week": 8, "topic": "SQLException", "level": 2, "q": "`printSQLException` loops `for (Throwable e : ex)`. Why can a `SQLException` be used in a for-each loop?", "opts": ["SQLException implements `Iterable<Throwable>` so chained exceptions can be visited", "Every exception in Java is an array", "Because it extends `ArrayList`", "It cannot; this code does not compile"], "ex": "SQLException은 여러 예외가 체인으로 연결될 수 있어서 `Iterable<Throwable>`을 구현해요. 그래서 for-each로 돌면서 SQLState, ErrorCode, Message를 출력해요.", "refs": [{"label": "Week 8 노트 · Basic JDBC Connection", "href": "week-08.html#basic-jdbc-connection"}]}, {"week": 1, "topic": "JVM", "level": 1, "q": "What does `javac Hello.java` produce?", "opts": ["`Hello.class` containing bytecode", "`Hello.exe` containing machine code", "`Hello.jar` containing source code", "Nothing; it runs the program directly"], "ex": "`javac`는 컴파일러: `.java` → `.class`(bytecode). 실행은 `java Hello`로 JVM이 해요.", "refs": [{"label": "Week 1 노트 · Steps to Use Java SE", "href": "week-01.html#steps-to-use-java-se"}]}, {"week": 1, "topic": "Java vs C++", "level": 2, "q": "How does Java free memory that was allocated with `new`?", "opts": ["The garbage collector reclaims objects that are no longer referenced", "With the `delete` keyword", "With a destructor `~ClassName()`", "With the `remove` keyword"], "ex": "Question Time 정답: Garbage Collected. Java에는 delete도 소멸자도 없어요.", "refs": [{"label": "Week 1 노트 · Question Time: How does Java delete the DMA?", "href": "week-01.html#question-time-how-does-java-delete-the-dma"}]}, {"week": 1, "topic": "static", "level": 2, "q": "Which line causes a compile error?", "code": "class Counter {\n    static int total;\n    int mine;\n    static void report() {\n        System.out.println(total);  // (a)\n        System.out.println(mine);   // (b)\n        System.out.println(this);   // (c)\n    }\n}", "opts": ["(b) and (c)", "Only (a)", "Only (c)", "None of them"], "ex": "static 메서드는 인스턴스 필드(`mine`)와 `this`를 쓸 수 없어요. static 필드 `total`은 OK.", "refs": [{"label": "Week 1 노트 · Static Keyword", "href": "week-01.html#static-keyword"}]}, {"week": 1, "topic": "MVC", "level": 2, "q": "According to the Week 1 MVC slides, where does calculation and data transformation happen?", "opts": ["Controller", "View", "Model", "main"], "ex": "\"Any calculation and data transformation happens in the control part of MVC.\" View는 보여주기만, Model은 데이터 관리.", "refs": [{"label": "Week 1 노트 · What is Controller in MVC?", "href": "week-01.html#what-is-controller-in-mvc"}]}, {"week": 1, "topic": "Polymorphism", "level": 2, "q": "What is printed?", "code": "Animal myCat = new Cat();\nmyCat.animalSound();", "opts": ["`The cat says: Meo Meo`", "`The animal makes a sound`", "Compile error: Animal has no Cat method", "Nothing"], "ex": "변수 타입이 Animal이어도 실제 객체가 Cat이면 Cat의 오버라이드 메서드가 불려요. Java 메서드는 기본이 virtual.", "refs": [{"label": "Week 1 노트 · Polymorphism", "href": "week-01.html#polymorphism"}]}];window.COURSE={"code": "APD545", "weeks": [{"n": 1, "title": "Java 입문과 MVC"}, {"n": 2, "title": "상속과 인터페이스"}, {"n": 3, "title": "컬렉션, 제네릭, 서비스 계층"}, {"n": 4, "title": "JavaFX 기초"}, {"n": 5, "title": "MVC 분리"}, {"n": 6, "title": "메뉴, 대화상자, DI"}, {"n": 7, "title": "여러 화면과 IoC"}, {"n": 8, "title": "ORM과 JDBC"}, {"n": 9, "title": "파일 입출력"}, {"n": 10, "title": "람다, 스트림, 바인딩"}, {"n": 11, "title": "스레드"}, {"n": 12, "title": "디자인 패턴"}, {"n": 13, "title": "네트워킹과 커넥션 풀"}], "exams": [{"id": "quiz4", "title": "Quiz 4 (11월 6일)", "weeks": [5, 6]}, {"id": "quiz5", "title": "Quiz 5 (11월 20일)", "weeks": [7, 8]}]};</script>
